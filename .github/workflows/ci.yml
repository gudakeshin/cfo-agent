name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cfo
          POSTGRES_PASSWORD: cfo
          POSTGRES_DB: cfo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cfo -d cfo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app/backend
    env:
      # Deterministic suite only: tests marked `llm` (real API calls) are excluded,
      # so this placeholder key is never sent anywhere.
      ANTHROPIC_API_KEY: sk-ant-test-key-deterministic-suite-only
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock
      - run: uv python install 3.13
      - run: uv sync --extra dev --frozen
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed
          key: fastembed-all-MiniLM-L6-v2
      - name: Test (SQLite)
        if: matrix.db == 'sqlite'
        run: uv run pytest -m "not llm" -q
      - name: Test (PostgreSQL + pgvector, schema built by migrations)
        if: matrix.db == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql+psycopg://cfo:cfo@localhost:5432/cfo_test
        run: uv run pytest -m "not llm" -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
