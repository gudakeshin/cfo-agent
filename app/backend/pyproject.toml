[project]
name = "cfo-agent"
version = "0.1.0"
description = "CFO Agentic Intelligence Solution — demo/prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "anthropic[bedrock,vertex]>=0.49.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "apscheduler>=3.10.4",
    "numpy>=2.1.0",
    "httpx>=0.28.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.5.0",
    "python-multipart>=0.0.17",
    "email-validator>=2.2.0",
    "cryptography>=43",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "defusedxml>=0.7",
    "python-pptx>=1.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that call the real Claude API (require ANTHROPIC_API_KEY)",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfo_agent"]
