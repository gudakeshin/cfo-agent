# Local sign-in users (AUTH_MODE=local). Do not edit hashes by hand — use:
#   python scripts/manage_users.py add someone@client.com --name "Full Name" --role cfo
# Roles: viewer | cfo | delegate | admin
users:
  - email: cfo@example.com
    name: Example CFO
    role: cfo
    password_hash: "pbkdf2_sha256$390000$<salt>$<hash>"
